<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiZone - Product Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider text-white bg-blue-600 px-3 py-1 rounded-lg">Accs<span class="text-blue-300">Zone</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <div id="authArea" class="flex items-center space-x-3 text-xs"></div>
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition">&larr; Back to Store</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-10 flex-grow w-full space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
            
            <!-- Product Header Info -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800 gap-4">
                <div>
                    <span id="productStockBadge" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 mb-2 inline-block">Checking stock...</span>
                    <h1 class="text-xl md:text-2xl font-bold text-white">Verified Grindr Account | Aged & Safe</h1>
                    <p class="text-xs text-slate-400 mt-1">Instant delivery automatically processed from our internal stock.</p>
                </div>
                <div class="text-left md:text-right">
                    <span class="text-xs text-slate-500 block">Unit Price</span>
                    <span id="unitPriceText" class="text-emerald-400 font-bold text-lg">$0.00</span>
                </div>
            </div>

            <!-- Quantity Selector & Total -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-slate-950 p-5 rounded-xl border border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-2">Select Quantity:</label>
                    <div class="flex items-center space-x-3">
                        <button onclick="updateQty(-1)" class="bg-slate-800 hover:bg-slate-700 text-white w-10 h-10 rounded-xl font-bold transition flex items-center justify-center">-</button>
                        <input type="number" id="quantityInput" value="1" min="1" max="10" onchange="calculateTotal()" class="w-16 bg-slate-900 border border-slate-800 rounded-xl py-2 text-center text-white text-sm focus:outline-none focus:border-blue-500">
                        <button onclick="updateQty(1)" class="bg-slate-800 hover:bg-slate-700 text-white w-10 h-10 rounded-xl font-bold transition flex items-center justify-center">+</button>
                    </div>
                </div>
                <div class="flex flex-col md:items-end justify-center">
                    <span class="text-xs text-slate-400 mb-1">Total Amount:</span>
                    <span id="totalPriceText" class="text-2xl font-black text-emerald-400">$0.00</span>
                </div>
            </div>

            <!-- Checkout Action Button -->
            <button id="checkoutBtn" onclick="buyProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> Complete Purchase & Get Accounts
            </button>

            <!-- Success/Delivery Result Box (Hidden Initially) -->
            <div id="resultBox" class="hidden bg-slate-950 border border-emerald-500/30 rounded-xl p-5 space-y-3">
                <h3 class="font-bold text-emerald-400 text-sm flex items-center"><i class="fa-solid fa-circle-check mr-2"></i> Purchase Successful! Here are your credentials:</h3>
                <textarea id="deliveredAccounts" readonly rows="4" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-blue-400 font-mono text-xs select-all"></textarea>
                <button onclick="window.location.href='orders.html'" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs font-semibold transition">
                    View in My Orders History &rarr;
                </button>
            </div>

        </div>
    </main>

    <!-- Custom Center Modal / Toast -->
    <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl transform transition-all">
            <div id="modalIcon" class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-xl"></div>
            <h3 id="modalTitle" class="font-bold text-white text-lg">Notification</h3>
            <p id="modalMessage" class="text-xs text-slate-300 leading-relaxed"></p>
            <button onclick="closeCustomModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-blue-600/20">
                OK
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-auto">
        <p>&copy; 2026 digizone System. All rights reserved.</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const API_URL = "https://digizone-kb46.onrender.com";
        let unitPrice = 2.50;
        let maxStock = 0;

        function showModal(message, type = 'success') {
            let modal = document.getElementById('customModal');
            let titleEl = document.getElementById('modalTitle');
            let msgEl = document.getElementById('modalMessage');
            let iconEl = document.getElementById('modalIcon');

            msgEl.innerText = message;

            if (type === 'success') {
                titleEl.innerText = "Success";
                iconEl.className = "w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl";
                iconEl.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
            } else {
                titleEl.innerText = "Notice / Error";
                iconEl.className = "w-12 h-12 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center mx-auto text-xl";
                iconEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomModal() {
            let modal = document.getElementById('customModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function initProductPage() {
            checkAuth();
            await loadProductDetails();
        }

        async function loadProductDetails() {
            try {
                let priceRes = await fetch(`${API_URL}/get-product-price/1`);
                let priceData = await priceRes.json();
                if (priceRes.ok) {
                    unitPrice = priceData.price;
                }

                let stockRes = await fetch(`${API_URL}/check-stock/1`);
                let stockData = await stockRes.json();
                let badge = document.getElementById('productStockBadge');
                let btn = document.getElementById('checkoutBtn');

                if (stockRes.ok) {
                    maxStock = stockData.available_stock;
                    if (maxStock > 0) {
                        badge.innerText = `In Stock (${maxStock} available)`;
                        badge.className = "text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 mb-2 inline-block";
                        btn.disabled = false;
                    } else {
                        badge.innerText = "Out of Stock ❌";
                        badge.className = "text-xs font-semibold px-2.5 py-1 rounded-md bg-red-500/10 text-red-400 mb-2 inline-block";
                        btn.disabled = true;
                        btn.innerText = "Sold Out";
                        btn.className = "w-full bg-slate-800 text-slate-500 font-bold py-3.5 rounded-xl text-sm cursor-not-allowed";
                    }
                }

                document.getElementById('unitPriceText').innerText = `$${unitPrice.toFixed(2)}`;
                calculateTotal();
            } catch (err) {
                console.error("Error loading product data", err);
            }
        }

        function updateQty(change) {
            let input = document.getElementById('quantityInput');
            let current = parseInt(input.value) || 1;
            let newVal = current + change;
            if (newVal < 1) newVal = 1;
            if (maxStock > 0 && newVal > maxStock) newVal = maxStock;
            input.value = newVal;
            calculateTotal();
        }

        function calculateTotal() {
            let qty = parseInt(document.getElementById('quantityInput').value) || 1;
            let total = qty * unitPrice;
            document.getElementById('totalPriceText').innerText = `$${total.toFixed(2)}`;
        }

        async function checkAuth() {
            let authArea = document.getElementById('authArea');
            let savedUser = localStorage.getItem("digizone_user");
            let userId = localStorage.getItem("digizone_user_id");

            if (savedUser && userId) {
                let currentBalance = parseFloat(localStorage.getItem("digizone_user_balance")) || 0.00;
                authArea.innerHTML = `
                    <span class="text-slate-300">${savedUser}</span>
                    <span class="bg-emerald-500/10 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/20">$${currentBalance.toFixed(2)}</span>
                `;
            } else {
                authArea.innerHTML = `
                    <a href="login.html" class="text-blue-400 hover:underline">Login to Buy</a>
                `;
            }
        }

        async function buyProduct() {
            let userId = localStorage.getItem("digizone_user_id");
            if (!userId) {
                showModal("You must log in first to purchase products!", "error");
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            let qty = parseInt(document.getElementById('quantityInput').value) || 1;
            let totalAmount = qty * unitPrice;

            let btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerText = "Processing Purchase...";

            try {
                let res = await fetch(`${API_URL}/buy-with-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        product_id: 1,
                        amount: totalAmount,
                        quantity: qty
                    })
                });
                let data = await res.json();

                if (res.ok) {
                    let currentBalance = parseFloat(localStorage.getItem("digizone_user_balance")) || 0.00;
                    localStorage.setItem("digizone_user_balance", currentBalance - totalAmount);

                    btn.classList.add('hidden');
                    let box = document.getElementById('resultBox');
                    box.classList.remove('hidden');
                    document.getElementById('deliveredAccounts').value = data.account_details;
                    
                    loadProductDetails();
                } else {
                    showModal(data.detail || "Purchase failed", "error");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cart-shopping"></i> Complete Purchase & Get Accounts`;
                }
            } catch (err) {
                showModal("Server connection error!", "error");
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cart-shopping"></i> Complete Purchase & Get Accounts`;
            }
        }

        initProductPage();
    </script>
</body>
</html>
