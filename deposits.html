<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiZone - Admin Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-xl font-black text-white">Admin Management Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Manage pending deposits and review platform transactions.</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold transition">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Store
                </a>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-3 mb-6">
            <button class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-wallet mr-2"></i> Deposit Requests
            </button>
            <a href="admin.html" class="bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white px-5 py-2.5 rounded-xl text-xs font-semibold border border-slate-800 transition">
                <i class="fa-solid fa-boxes-stacked mr-2"></i> Account Purchases & Stock
            </a>
        </div>

        <!-- Pending Deposits Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> Pending Deposit Requests
            </h2>
            <div id="pendingDepositsContainer" class="space-y-3">
                <div class="p-4 text-center text-slate-400 text-xs">Loading pending deposits...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://digizone-kb46.onrender.com";
        const adminSecret = "1"; // كلمة سر الأدمن الافتراضية

        async function loadPendingDeposits() {
            let container = document.getElementById('pendingDepositsContainer');
            try {
                let response = await fetch(`${API_URL}/get-pending-deposits?admin_secret=${adminSecret}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                let data = await response.json();

                if (response.ok && data.status === "success") {
                    container.innerHTML = "";
                    
                    if (!data.deposits || data.deposits.length === 0) {
                        container.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">No pending deposits found.</div>`;
                        return;
                    }

                    data.deposits.forEach(deposit => {
                        container.innerHTML += `
                            <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>
                                    <p class="text-sm font-bold text-white">Deposit ID: #${deposit.order_id}</p>
                                    <p class="text-xs text-slate-400 mt-0.5">User: <span class="text-slate-200">${deposit.customer_name}</span> (${deposit.customer_email})</p>
                                    <p class="text-xs text-emerald-400 font-semibold mt-1">Amount: $${deposit.amount}</p>
                                    <p class="text-xs text-slate-500 mt-0.5 font-mono">TXID: ${deposit.txid}</p>
                                </div>
                                <button onclick="approveDeposit(${deposit.order_id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shadow-lg shadow-emerald-600/20 whitespace-nowrap">
                                    <i class="fa-solid fa-check mr-1.5"></i> Approve Deposit
                                </button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<div class="p-4 text-center text-red-400 text-xs">❌ ${data.detail || "Failed to load deposits"}</div>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="p-4 text-center text-red-400 text-xs">❌ Server connection error</div>`;
            }
        }

        async function approveDeposit(orderId) {
            if (!confirm(`Are you sure you want to approve deposit #${orderId}?`)) return;

            try {
                let response = await fetch(`${API_URL}/approve-deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: orderId,
                        admin_secret: adminSecret
                    })
                });

                let data = await response.json();

                if (response.ok && data.status === "success") {
                    alert("✅ " + data.message);
                    loadPendingDeposits(); // إعادة تحميل القائمة لتحديث الحالات
                } else {
                    alert("❌ " + (data.detail || "Failed to approve deposit"));
                }
            } catch (err) {
                console.error(err);
                alert("❌ Server connection error");
            }
        }

        // تحميل الطلبات فور فتح الصفحة
        loadPendingDeposits();
    </script>
</body>
</html>
