<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digizone - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-3xl font-black tracking-wider text-white bg-blue-600 px-3 py-1.5 rounded-xl inline-block mb-3">Digi<span class="text-blue-300">Zone</span></span>
            <h2 class="text-xl font-bold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400 mt-1">Log in to your digizone account to continue.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 text-sm text-white focus:outline-none focus:border-blue-500" required>
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-10 text-sm text-white focus:outline-none focus:border-blue-500" required>
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
                Log In
            </button>
        </form>
        <p id="resultMsg" class="mt-4 text-center text-xs font-semibold"></p>
        
        <div class="mt-6 text-center border-t border-slate-800 pt-4 text-xs text-slate-400">
            Don't have an account? <a href="signup.html" class="text-blue-400 hover:underline">Sign Up</a>
        </div>
    </div>

    <script>
        const API_URL = "https://digizone-kb46.onrender.com";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let msg = document.getElementById('resultMsg');

            msg.className = "mt-4 text-center text-xs font-semibold text-slate-400";
            msg.innerText = "Logging in...";

            try {
                let response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                let data = await response.json();

                if (response.ok) {
                    msg.className = "mt-4 text-center text-xs font-semibold text-emerald-400";
                    msg.innerText = "✅ " + data.message + " Redirecting...";
                    
                    localStorage.setItem("digizone_user", data.user.full_name);
                    localStorage.setItem("digizone_user_id", data.user.id);

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    msg.className = "mt-4 text-center text-xs font-semibold text-red-400";
                    msg.innerText = "❌ " + (data.detail || "Invalid email or password");
                }
            } catch (err) {
                console.error(err);
                msg.className = "mt-4 text-center text-xs font-semibold text-red-400";
                msg.innerText = "❌ Server connection error";
            }
        });
    </script>
</body>
</html>
